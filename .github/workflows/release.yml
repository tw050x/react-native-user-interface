name: Release

# Run from the Actions tab: pick a package and a version bump. With dry run
# on (the default) it shows what would happen without changing anything.
#
# "publish-only" skips the version bump and publishes the version already in
# the package's package.json: use it if a release failed after tagging.
#
# Publishing uses npm trusted publishing (OIDC), so no npm token is stored.
# Each package must list this repository and this workflow file (release.yml)
# as its trusted publisher in its settings on npmjs.com.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - date-picker-modal
          - time-picker-modal
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - publish-only
      dry-run:
        description: Dry run (show what would happen, change nothing)
        required: true
        type: boolean
        default: true

# One release at a time, so two runs cannot race for the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.package }} (${{ inputs.bump }})
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history and tags, to write release notes since the last release.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          # No registry-url: it writes an .npmrc expecting NODE_AUTH_TOKEN, which
          # breaks Yarn 1. Trusted publishing needs no token, and npm already
          # publishes to registry.npmjs.org.

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint, test and typecheck
        run: yarn nx run-many --targets=lint,test,typecheck --projects=${{ inputs.package }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Builds, bumps the version, commits, tags (<package>@<version>), pushes
      # and creates the GitHub release. See "release" in nx.json.
      - name: Version and tag
        if: inputs.bump != 'publish-only'
        run: yarn nx release ${{ inputs.bump }} --projects=${{ inputs.package }} --yes --skip-publish ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: inputs.bump == 'publish-only'
        run: yarn nx build ${{ inputs.package }}

      # Published with npm itself: Nx would use `yarn publish` here, and Yarn 1
      # does not support trusted publishing. npm adds provenance automatically.
      - name: Publish to npm
        working-directory: dist/libs/@react-native-user-interface/${{ inputs.package }}
        run: npm publish --access public ${{ inputs.dry-run && '--dry-run' || '' }}
